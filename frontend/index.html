<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Narrator — Auto YouTube Videos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #08090a;
            --bg-panel: #0f1011;
            --bg-surface: #191a1b;
            --bg-hover: #28282c;
            --text-primary: #f7f8f8;
            --text-secondary: #d0d6e0;
            --text-tertiary: #8a8f98;
            --text-quaternary: #62666d;
            --brand-indigo: #5e6ad2;
            --brand-accent: #7170ff;
            --brand-hover: #828fff;
            --border-subtle: rgba(255, 255, 255, 0.05);
            --border-standard: rgba(255, 255, 255, 0.08);
            --success: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 64px 24px;
        }

        header {
            margin-bottom: 64px;
            text-align: center;
        }

        header h1 {
            font-size: 48px;
            font-weight: 500;
            letter-spacing: -1.056px;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-feature-settings: "cv01", "ss03";
        }

        header p {
            font-size: 16px;
            color: var(--text-tertiary);
            font-weight: 400;
        }

        main {
            min-height: 300px;
        }

        .section {
            margin-bottom: 48px;
        }

        .section h2 {
            font-size: 20px;
            font-weight: 590;
            letter-spacing: -0.24px;
            margin-bottom: 24px;
            color: var(--text-primary);
            font-feature-settings: "cv01", "ss03";
        }

        form {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
        }

        input[type="text"],
        textarea {
            flex: 1;
            padding: 11px 13px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-standard);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-feature-settings: "cv01", "ss03";
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--brand-accent);
            box-shadow: rgba(0, 0, 0, 0.1) 0px 4px 12px;
        }

        button {
            padding: 11px 16px;
            background: var(--brand-indigo);
            color: var(--text-primary);
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 510;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            font-feature-settings: "cv01", "ss03";
        }

        button:hover {
            background: var(--brand-hover);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-standard);
            color: var(--text-secondary);
            margin-right: 8px;
        }

        button.secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .job-info {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-standard);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .job-info p {
            font-size: 15px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-info code {
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--brand-accent);
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border-radius: 12px;
            font-size: 13px;
            font-weight: 510;
        }

        .alert {
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            border-radius: 6px;
            padding: 12px;
            color: #fca5a5;
            font-size: 14px;
            margin-top: 16px;
        }

        .hidden {
            display: none !important;
        }

        footer {
            margin-top: 64px;
            padding-top: 32px;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 13px;
            color: var(--text-quaternary);
        }

        footer p {
            margin: 4px 0;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 32px;
                letter-spacing: -0.704px;
            }

            form {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>YT Narrator</h1>
            <p>Auto-generate YouTube videos from topics</p>
        </header>

        <main>
            <!-- Submit -->
            <section id="submit-section" class="section">
                <h2>Create Video</h2>
                <form id="submit-form">
                    <textarea id="topic-input" placeholder="Enter topic..." required></textarea>
                    <button type="submit">Generate</button>
                </form>
            </section>

            <!-- Status -->
            <section id="status-section" class="section hidden">
                <h2>Processing</h2>
                <div class="job-info">
                    <p>Job ID: <code id="job-id"></code></p>
                    <p>Status: <span id="job-status" class="status-badge"></span></p>
                    <p>Stage: <span id="job-stage" style="color: var(--text-tertiary);"></span></p>
                    <p>Progress: <span id="job-progress" style="color: var(--text-tertiary);"></span></p>
                </div>
                <div id="error-msg" class="alert hidden">
                    <strong>Error:</strong> <span id="error-text"></span>
                </div>
            </section>

            <!-- Download -->
            <section id="download-section" class="section hidden">
                <h2>✓ Complete</h2>
                <p style="color: var(--text-tertiary); margin-bottom: 24px;">Your video is ready</p>
                <a id="download-btn" href="#" style="
                    display: inline-block;
                    padding: 11px 16px;
                    background: var(--brand-indigo);
                    color: var(--text-primary);
                    text-decoration: none;
                    border-radius: 6px;
                    margin-right: 8px;
                    transition: all 0.2s;
                ">Download Video</a>
                <button id="regenerate-btn" class="secondary">Regenerate</button>
                <button id="new-job-btn" class="secondary">New Job</button>
            </section>
        </main>

        <footer>
            <p><strong>Cost:</strong> $0.00 | <strong>Drift:</strong> < 100ms | <strong>FPS:</strong> 24</p>
            <p style="margin-top: 8px;">Powered by HF FLUX.1 + Google Gemini + edge-tts</p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
